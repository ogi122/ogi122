<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" role="img" aria-label="Currently learning software architecture and backend engineering, and experimenting with open-source LLMs locally" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; font-size: 15px; }
    .prompt { fill: #38B2AC; font-weight: 600; }
    .out { fill: #E6EDF3; }
    .bar { fill: #8B949E; font-size: 12px; }

    #r1 { animation: t1 12s steps(43, end) infinite; }
    #r2 { animation: t2 12s steps(25, end) infinite; }
    #p1 { animation: p1 12s step-end infinite; }
    #p2 { animation: p2 12s step-end infinite; }
    #k1 { opacity: 0; animation: k1x 12s steps(43, end) infinite, k1o 12s step-end infinite; }
    #k2 { opacity: 0; animation: k2x 12s steps(25, end) infinite, k2o 12s step-end infinite; }

    @keyframes t1 { 0%,4% { width: 0 } 22%,88% { width: 387px } 88.1%,100% { width: 0 } }
    @keyframes t2 { 0%,28% { width: 0 } 41%,88% { width: 225px } 88.1%,100% { width: 0 } }
    @keyframes p1 { 0%,3% { opacity: 0 } 3.1%,88% { opacity: 1 } 88.1%,100% { opacity: 0 } }
    @keyframes p2 { 0%,27% { opacity: 0 } 27.1%,88% { opacity: 1 } 88.1%,100% { opacity: 0 } }
    @keyframes k1x { 0%,4% { transform: translateX(0) } 22%,100% { transform: translateX(387px) } }
    @keyframes k1o { 0% { opacity: 0 } 3% { opacity: 1 } 26% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes k2x { 0%,28% { transform: translateX(0) } 41%,100% { transform: translateX(225px) } }
    @keyframes k2o { 0%{opacity:0} 28%{opacity:1} 41.00%{opacity:1} 45.17%{opacity:0} 49.34%{opacity:1} 53.51%{opacity:0} 57.68%{opacity:1} 61.85%{opacity:0} 66.02%{opacity:1} 70.19%{opacity:0} 74.36%{opacity:1} 78.53%{opacity:0} 82.70%{opacity:1} 86.87%{opacity:0} 88%{opacity:0} 100%{opacity:0} }
  </style>

  <defs>
    <clipPath id="c1"><rect id="r1" x="123" y="54" width="387" height="22"/></clipPath>
    <clipPath id="c2"><rect id="r2" x="168" y="84" width="225" height="22"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="127" rx="10" fill="#0D1117" stroke="#30363D"/>
  <path d="M0.5 10.5a10 10 0 0 1 10-10h619a10 10 0 0 1 10 10V30H0.5z" fill="#161B22"/>
  <circle cx="20" cy="15" r="5" fill="#FF5F56"/>
  <circle cx="38" cy="15" r="5" fill="#FFBD2E"/>
  <circle cx="56" cy="15" r="5" fill="#27C93F"/>
  <text class="bar" x="76" y="19">ogi@dev: ~</text>

  <text id="p1" class="prompt" x="24" y="70" textLength="90" lengthAdjust="spacingAndGlyphs">$ learning</text>
  <g clip-path="url(#c1)"><text class="out" x="123" y="70" textLength="387" lengthAdjust="spacingAndGlyphs">software architecture &amp; backend engineering</text></g>
  <rect id="k1" x="123" y="56" width="9" height="18" fill="#38B2AC"/>

  <text id="p2" class="prompt" x="24" y="100" textLength="135" lengthAdjust="spacingAndGlyphs">$ experimenting</text>
  <g clip-path="url(#c2)"><text class="out" x="168" y="100" textLength="225" lengthAdjust="spacingAndGlyphs">open-source LLMs, locally</text></g>
  <rect id="k2" x="168" y="86" width="9" height="18" fill="#38B2AC"/>
</svg>
